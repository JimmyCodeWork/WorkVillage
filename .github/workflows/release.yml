name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if ! grep -q "\"version\": \"$version\"" "$file"; then
              echo "::error file=$file::version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error file=CHANGELOG.md::no section for $version"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "WorkVillage $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
